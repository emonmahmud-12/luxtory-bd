<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxtory Bd — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#111}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{width:250px;background:#111;color:#fff;position:fixed;inset:0 auto 0 0;padding:18px 14px;z-index:30}.brand{font-size:23px;font-weight:800;padding:10px 12px 22px}.brand small{display:block;color:#888;font-size:10px;margin-top:4px}.nav button{width:100%;background:transparent;color:#aaa;border:0;text-align:left;padding:12px 13px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#222;color:#fff}.main{margin-left:250px;padding:20px 26px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:27px}.title p{margin:4px 0;color:#777;font-size:12px}.actions{display:flex;gap:8px;align-items:center}.btn{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 13px}.btn.dark{background:#111;color:#fff;border-color:#111}.live{font-size:11px;background:#eaf8ef;color:#16803c;padding:9px 11px;border-radius:99px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid #e5e6e9;border-radius:15px;padding:17px}.metric .label{font-size:12px;color:#777}.metric .value{font-size:28px;font-weight:800;margin-top:9px}.sectiongrid{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;margin-top:13px}.tablewrap{overflow:auto}.adminTable{width:100%;border-collapse:collapse;font-size:12px}.adminTable th,.adminTable td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.thumb{width:42px;height:52px;object-fit:cover;border-radius:7px;background:#eee}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:10px}.ok{background:#eaf8ef;color:#16803c}.warn{background:#fff4d9;color:#986900}.bad{background:#ffe9e9;color:#a22}.more{position:relative;display:inline-block}.dots{width:35px;height:35px;border-radius:9px;background:#f4f4f5;border:1px solid #ddd;font-size:20px}.menu{display:none;position:absolute;right:0;top:39px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 25px #0002;min-width:145px;z-index:20;padding:5px}.menu.show{display:block}.menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px;border-radius:7px;font-size:12px}.menu button:hover{background:#f3f3f3}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0;font-size:12px}.field input,.field select,.field textarea{padding:10px;border:1px solid #ddd;border-radius:9px;width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;place-items:center;padding:15px}.modal.show{display:grid}.modalbox{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.mobilemenu{display:none;background:#111;color:#fff;border:0;border-radius:10px;width:40px;height:40px}.login{position:fixed;inset:0;background:#111;display:grid;place-items:center;z-index:200}.loginbox{width:min(390px,92%);background:#fff;border-radius:18px;padding:25px}.toast{position:fixed;right:15px;bottom:15px;background:#111;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:300;font-size:12px}.toast.show{display:block}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;padding:15px}.mobilemenu{display:block}.grid{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:1fr}.actions{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.title h1{font-size:22px}.live{display:none}}
</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><h2 style="margin:0">Luxtory Bd</h2><p style="color:#777;font-size:12px">Admin Control Center</p>
<label class="field">Email<input id="email" type="email" autocomplete="username" required></label>
<label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn dark" style="width:100%;margin-top:8px">LOGIN</button><p id="loginMsg" style="color:#b22;font-size:12px"></p></form></div>
<div id="app" class="app" style="display:none"><aside id="sidebar" class="sidebar"><div class="brand">Luxtory Bd<small>ADMIN CONTROL CENTER</small></div><div class="nav">
<button class="active" data-view="dashboard">▦ Dashboard</button><button data-view="orders">◫ Orders</button><button data-view="products">□ Products</button><button data-view="inventory">▤ Inventory</button><button data-view="customers">♙ Customers</button><button data-view="analytics">⌁ Analytics</button><button data-view="coupons">◈ Coupons</button><button data-view="website">▧ Website</button><button data-view="settings">⚙ Settings</button></div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:8px"><button id="mobilemenu" class="mobilemenu">☰</button><div class="title"><h1 id="pageTitle">Dashboard</h1><p>Luxtory Bd store control center</p></div></div><div class="actions"><span class="live">● Connected</span><button id="refresh" class="btn">↻ Refresh</button><button id="add" class="btn dark">＋ Add Product</button><button id="logout" class="btn">Logout</button></div></header><div id="view"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle" style="margin:0"></h2><button id="modalClose" class="btn">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://fyyxxgajjweljtxvhtua.supabase.co';
const SUPABASE_KEY='sb_publishable_P0sHN8LbfrGF90PCWfYc6A_e94VsTDg';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],orders=[],customers=[],categories=[],view='dashboard';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)enter();sb.auth.onAuthStateChange((_e,s)=>{if(s)enter();});}
async function enter(){ $('login').style.display='none';$('app').style.display='block';await load(); }
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginMsg').textContent=error.message;};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('mobilemenu').onclick=()=>$('sidebar').classList.toggle('open');$('refresh').onclick=load;$('add').onclick=()=>productForm();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('sidebar').classList.remove('open');render()});
async function load(){const [p,o,c,cat]=await Promise.all([
sb.from('products').select('*,product_images(*),product_variants(*)').order('created_at',{ascending:false}),
sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300),
sb.from('customers').select('*').order('created_at',{ascending:false}).limit(300),
sb.from('categories').select('id,name').order('name')]);
if(p.error){toast(p.error.message);return}products=p.data||[];orders=o.data||[];customers=c.data||[];categories=cat.data||[];render();}
function render(){$('pageTitle').textContent=view[0].toUpperCase()+view.slice(1);if(view==='dashboard')dashboard();else if(view==='products'||view==='inventory')productView();else if(view==='orders')orderView();else if(view==='customers')customerView();else if(view==='analytics')analytics();else if(view==='coupons')couponView();else if(view==='website')websiteView();else settingsView();}
function dashboard(){const valid=orders.filter(o=>o.order_status!=='cancelled'),sales=valid.reduce((a,o)=>a+Number(o.total_amount||0),0),stock=products.flatMap(p=>p.product_variants||[]).reduce((a,v)=>a+Number(v.stock||0),0);$('view').innerHTML=`<section class="grid">
<div class="card metric"><span class="label">Products</span><div class="value">${products.length}</div></div><div class="card metric"><span class="label">Orders</span><div class="value">${orders.length}</div></div><div class="card metric"><span class="label">Customers</span><div class="value">${customers.length}</div></div><div class="card metric"><span class="label">Sales</span><div class="value">${money(sales)}</div></div></section>
<section class="sectiongrid"><div class="card"><h2>Recent Orders</h2>${orderTable(orders.slice(0,8))}</div><div class="card"><h2>Stock Alerts</h2>${products.flatMap(p=>(p.product_variants||[]).map(v=>({p,v}))).filter(x=>x.v.stock<=5).slice(0,8).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee;font-size:12px"><b>${esc(x.p.name)}</b><br>${esc(x.v.size||'')} ${esc(x.v.color||'')} — <span class="warn pill">${x.v.stock} left</span></div>`).join('')||'<p style="color:#777;font-size:12px">No low-stock variants.</p>'}</div></section>`}
function orderTable(os){return `<div class="tablewrap"><table class="adminTable"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr>${os.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}<br>${esc(o.customer_phone)}</td><td>${money(o.total_amount)}</td><td><span class="pill ${o.order_status==='delivered'?'ok':o.order_status==='cancelled'?'bad':'warn'}">${esc(o.order_status)}</span></td><td>${moreMenu('order',o.id)}</td></tr>`).join('')}</table></div>`}
function moreMenu(type,id){return `<span class="more"><button class="dots" onclick="toggleMenu(this)">⋮</button><span class="menu"><button onclick="closeMenus();${type==='product'?`productForm('${id}')`:`orderDetails('${id}')`}">View / Edit</button>${type==='product'?`<button onclick="closeMenus();toggleProduct('${id}')">Toggle status</button><button onclick="closeMenus();deleteProduct('${id}')">Delete</button>`:`<button onclick="closeMenus();quickStatus('${id}')">Change status</button>`}</span></span>`}
function toggleMenu(b){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'));b.nextElementSibling.classList.toggle('show')}function closeMenus(){document.querySelectorAll('.menu.show').forEach(x=>x.classList.remove('show'))}document.addEventListener('click',e=>{if(!e.target.closest('.more'))closeMenus()});
function orderView(){$('view').innerHTML=`<div class="card"><div class="modalhead"><h2>Orders (${orders.length})</h2><button class="btn" onclick="load()">Refresh</button></div>${orderTable(orders)}</div>`}
function orderDetails(id){const o=orders.find(x=>x.id===id);if(!o)return;openModal('Order '+(o.order_number||''),`<p><b>${esc(o.customer_name)}</b> · ${esc(o.customer_phone)}</p><p>${esc(o.shipping_address||'')}, ${esc(o.area||'')}, ${esc(o.city||'')}</p><p>Total: <b>${money(o.total_amount)}</b></p><label class="field">Status<select id="ost">${['pending','confirmed','processing','shipped','delivered','cancelled'].map(s=>`<option ${o.order_status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn dark" onclick="setStatus('${o.id}',$('ost').value)">Save status</button>`)}
async function quickStatus(id){const o=orders.find(x=>x.id===id);if(o)orderDetails(id)}
async function setStatus(id,status){const {error}=await sb.from('orders').update({order_status:status,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{closeModal();toast('Order updated');await load()}}
function productView(){$('view').innerHTML=`<div class="card"><div class="modalhead"><h2>${view==='inventory'?'Inventory':'Products'} (${products.length})</h2><button class="btn dark" onclick="productForm()">＋ Add Product</button></div><div class="tablewrap"><table class="adminTable"><tr><th>Photo</th><th>Name</th><th>Price</th><th>Variants / Stock</th><th>Status</th><th></th></tr>${products.map(p=>{const img=(p.product_images||[]).find(i=>i.is_primary)?.image_url||(p.product_images||[])[0]?.image_url;const stock=(p.product_variants||[]).reduce((a,v)=>a+Number(v.stock||0),0);return `<tr><td>${img?`<img class="thumb" src="${esc(img)}">`:'—'}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.sku||'')}</small></td><td>${money(p.discount_price??p.price)}</td><td>${(p.product_variants||[]).length} / ${stock}</td><td><span class="pill ${p.status==='active'?'ok':'bad'}">${esc(p.status)}</span></td><td>${moreMenu('product',p.id)}</td></tr>`}).join('')}</table></div></div>`}
async function toggleProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const {error}=await sb.from('products').update({status:p.status==='active'?'hidden':'active',updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{toast('Product status updated');load()}}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)toast(error.message);else{toast('Product deleted');load()}}
function productForm(id){const p=products.find(x=>x.id===id)||{name:'',price:'',discount_price:'',sku:'',description:'',category_id:'',status:'active',featured:false};const vars=p.product_variants||[];openModal(id?'Edit Product':'Add Product',`<form id="pf"><div class="formgrid">
<label class="field">Name *<input name="name" value="${esc(p.name)}" required></label><label class="field">SKU<input name="sku" value="${esc(p.sku||'')}"></label>
<label class="field">Price *<input name="price" type="number" min="0" step=".01" value="${p.price}" required></label><label class="field">Discount price<input name="discount_price" type="number" min="0" step=".01" value="${p.discount_price??''}"></label>
<label class="field">Category<select name="category_id"><option value="">—</option>${categories.map(c=>`<option value="${c.id}" ${p.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<label class="field">Status<select name="status"><option ${p.status==='active'?'selected':''}>active</option><option ${p.status==='hidden'?'selected':''}>hidden</option></select></label>
<label class="field full">Description<textarea name="description" rows="4">${esc(p.description||'')}</textarea></label>
<div class="full"><b style="font-size:12px">Variants (optional)</b><div id="vars">${vars.map((v,i)=>variantRow(v,i)).join('')}</div><button type="button" class="btn" onclick="addVariant()">＋ Variant</button></div>
</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">Save Product</button></div></form>`);
$('pf').onsubmit=saveProduct}
function variantRow(v={},i=Date.now()){return `<div class="vrow" style="display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:6px;margin:7px 0"><input placeholder="Size" data-v="size" value="${esc(v.size||'')}"><input placeholder="Color" data-v="color" value="${esc(v.color||'')}"><input type="number" min="0" placeholder="Stock" data-v="stock" value="${v.stock??0}"><button type="button" class="btn" onclick="this.parentElement.remove()">×</button></div>`}
function addVariant(){ $('vars').insertAdjacentHTML('beforeend',variantRow())}
async function saveProduct(e){e.preventDefault();const f=new FormData(e.target);const data={name:f.get('name'),price:Number(f.get('price')),discount_price:f.get('discount_price')?Number(f.get('discount_price')):null,sku:f.get('sku')||null,description:f.get('description')||null,category_id:f.get('category_id')||null,status:f.get('status'),updated_at:new Date().toISOString()};if(!id)data.slug=f.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now();const q=id?await sb.from('products').update(data).eq('id',id).select().single():await sb.from('products').insert(data).select().single();if(q.error){toast(q.error.message);return}const pid=id?id:q.data.id;const rows=[...document.querySelectorAll('.vrow')].map(r=>{const z={};r.querySelectorAll('[data-v]').forEach(x=>z[x.dataset.v]=x.value);return z}).filter(v=>v.size||v.color||Number(v.stock)>0);if(id){await sb.from('product_variants').delete().eq('product_id',pid)}if(rows.length){const vr=rows.map(v=>({product_id:pid,size:v.size||null,color:v.color||null,stock:Number(v.stock||0),status:'active',sku:(data.sku||'LB')+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}));const r=await sb.from('product_variants').insert(vr);if(r.error){toast(r.error.message);return}}closeModal();toast('Product saved');load()}
function customerView(){$('view').innerHTML=`<div class="card"><h2>Customers (${customers.length})</h2><div class="tablewrap"><table class="adminTable"><tr><th>Name</th><th>Phone</th><th>Email</th><th>City</th><th>Orders</th></tr>${customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email||'')}</td><td>${esc(c.city||'')}</td><td>${orders.filter(o=>o.customer_id===c.id).length}</td></tr>`).join('')}</table></div></div>`}
function analytics(){const v=orders.filter(o=>o.order_status!=='cancelled'),sales=v.reduce((a,o)=>a+Number(o.total_amount||0),0);$('view').innerHTML=`<section class="grid"><div class="card metric"><span class="label">Gross sales</span><div class="value">${money(sales)}</div></div><div class="card metric"><span class="label">Average order</span><div class="value">${money(v.length?sales/v.length:0)}</div></div><div class="card metric"><span class="label">Delivered</span><div class="value">${orders.filter(o=>o.order_status==='delivered').length}</div></div><div class="card metric"><span class="label">Cancelled</span><div class="value">${orders.filter(o=>o.order_status==='cancelled').length}</div></div></section>`}
function couponView(){$('view').innerHTML='<div class="card"><h2>Coupons</h2><p style="font-size:12px;color:#777">Coupon management is ready for the <b>coupons</b> table. Full CRUD can be enabled with the same RLS/admin policy.</p></div>'}
function websiteView(){$('view').innerHTML='<div class="card"><h2>Website Control</h2><p style="font-size:12px;color:#777">Homepage banners and store settings use <b>store_banners</b> and <b>store_settings</b>. Customer site reads active settings from Supabase.</p></div>'}
function settingsView(){$('view').innerHTML='<div class="card"><h2>Settings</h2><p style="font-size:12px;color:#777">Admin authentication uses Supabase Auth. Only the public/publishable key is embedded in this frontend.</p></div>'}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
init();
</script></body></html>
